<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>uniXecure 後台｜新聞中心管理</title>
<link rel="stylesheet" href="style.css" />
<script src="https://kit.fontawesome.com/fb083deec1.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="topbar">
  <div class="wrap topbar__inner">
    <div class="topbar__brand">
      <span class="topbar__brand-badge">UX</span>
      uniXecure 內容管理後台
    </div>
    <div class="topbar__right"><a class="topbar__back" href="../index.html"><i>←</i> 回官網</a><div class="topbar__crumb">
      <a href="index.html">後台首頁</a>
      <span class="topbar__crumb-sep">/</span>
      <span class="topbar__crumb-current">新聞中心</span>
    </div>
  </div></div>
</div>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>新聞中心</h1>
    </div>
    <a class="btn btn-primary" href="news-editor.html">＋ 新增新聞</a>
  </div>

  <div class="list-toolbar">
    <div class="list-search">
      <span>搜尋</span>
      <input type="text" id="kw" placeholder="輸入標題關鍵字" />
    </div>
    <div class="list-toolbar__right">
      <div id="colToggle"></div>
      <button class="btn" id="trashToggle" type="button"></button>
    </div>
  </div>

  <div class="data-list" id="dataList"></div>
  <div class="pagination" id="pagination"></div>
  <div class="th-filter__panel" id="thFilterPanel" hidden></div>

  <div id="trashSection" style="display:none;margin-top:28px">
    <div class="page-head" style="padding:0 0 14px">
      <div>
        <h1 style="font-size:16px">垃圾桶</h1>
        <p>移到垃圾桶的文章還佔用原本的網址(slug)，避免還原後撞網址;確定不要了再永久刪除。</p>
      </div>
    </div>
    <div class="data-list" id="trashList"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
let showTrash = false;

/* 欄位定義:標題／操作鎖定必顯示,其餘可在「欄位設定」勾選 */
const NEWS_COLUMNS = [
  { key: 'cover', label: '封面', width: '64px' },
  { key: 'title', label: '標題', width: 'minmax(220px,1fr)', locked: true },
  { key: 'tags', label: '標籤', width: '110px' },
  { key: 'status', label: '狀態', width: '100px' },
  { key: 'date', label: '日期', width: '90px' },
  { key: 'actions', label: '操作', width: '160px', align: 'right', locked: true },
];

function newsCell(key, n) {
  switch (key) {
    case 'cover': return `<img class="data-thumb" src="${n.cover || ''}" alt="" onerror="this.style.visibility='hidden'" />`;
    case 'title': return `<div><div class="data-title">${escapeHtml(n.title)}</div><div class="data-sub">/${n.slug || ''}</div></div>`;
    case 'tags': return `<div style="display:flex;flex-wrap:wrap;gap:4px">${tagChipsHtml(n.tags, 3, 'data-tag', '<span class="data-sub">—</span>')}</div>`;
    case 'status': { const s = getStatus(n); return `<span class="status-badge status-badge--${s}">${STATUS_LABEL[s]}</span>`; }
    case 'date': return `<div class="data-date">${dateTimeCellHtml(n.publishAt)}</div>`;
    case 'actions': return `<div class="data-actions"><a class="btn btn-sm" href="news-editor.html?id=${n.id}">編輯</a><button class="btn btn-sm btn-danger" onclick="trashItem('${n.id}')">移到垃圾桶</button></div>`;
  }
}

let visibleCols = NEWS_COLUMNS;
createColumnToggle(document.getElementById('colToggle'), 'ux_admin_news_cols_v1', NEWS_COLUMNS, keys => {
  visibleCols = NEWS_COLUMNS.filter(c => keys.includes(c.key));
  document.getElementById('dataList').style.setProperty('--cols', visibleCols.map(c => c.width).join(' '));
  render();
});

/* ── 表頭篩選(狀態 / 標籤):面板獨立浮在 body 上，不受表格橫向捲動裁切影響 ── */
const statusFilterSel = new Set();
const tagFilterSel = new Set();
let openFilterCol = null; // 'status' | 'tags' | null
const filterPanelEl = document.getElementById('thFilterPanel');
const STATUS_ORDER = ['published', 'scheduled', 'draft'];

function filterOptionRow(label, checked, onclick) {
  return `<label class="col-toggle__item"><input type="checkbox" onchange="${onclick}" ${checked ? 'checked' : ''} /> ${label}</label>`;
}

function renderFilterPanel() {
  if (!openFilterCol) { filterPanelEl.hidden = true; return; }
  let title, body;
  if (openFilterCol === 'status') {
    title = '狀態篩選';
    body = STATUS_ORDER.map(v => filterOptionRow(STATUS_LABEL[v], statusFilterSel.has(v), `toggleStatusFilter('${v}')`)).join('');
  } else {
    title = '標籤篩選';
    const opts = sortTags([...PRODUCT_TAGS, ...getCommonTags()]);
    body = `<div class="th-filter__list">${opts.map(v => filterOptionRow(escapeHtml(v), tagFilterSel.has(v), `toggleTagFilter('${escapeHtml(v)}')`)).join('')}</div>`;
  }
  const sel = openFilterCol === 'status' ? statusFilterSel : tagFilterSel;
  filterPanelEl.innerHTML = `
    <div class="th-filter__head">${title}${sel.size ? `<button type="button" class="th-filter__clear" onclick="clearColFilter('${openFilterCol}')">清除</button>` : ''}</div>
    ${body}`;
  filterPanelEl.hidden = false;
}

function positionFilterPanel(btn) {
  const r = btn.getBoundingClientRect();
  filterPanelEl.style.top = (r.bottom + window.scrollY + 6) + 'px';
  filterPanelEl.style.left = Math.max(8, r.right + window.scrollX - 200) + 'px';
}

function toggleFilterPanel(col, btn) {
  if (openFilterCol === col) { openFilterCol = null; renderFilterPanel(); return; }
  openFilterCol = col;
  renderFilterPanel();
  positionFilterPanel(btn);
}
function toggleStatusFilter(v) {
  statusFilterSel.has(v) ? statusFilterSel.delete(v) : statusFilterSel.add(v);
  currentPage = 1; render();
}
function toggleTagFilter(v) {
  tagFilterSel.has(v) ? tagFilterSel.delete(v) : tagFilterSel.add(v);
  currentPage = 1; render();
}
function clearColFilter(col) {
  (col === 'status' ? statusFilterSel : tagFilterSel).clear();
  currentPage = 1; render();
}
document.addEventListener('click', e => {
  if (!openFilterCol) return;
  if (e.target.closest('#thFilterPanel') || e.target.closest('.th-filter__btn')) return;
  openFilterCol = null;
  filterPanelEl.hidden = true;
});

function headerCell(c) {
  if (c.key === 'status' || c.key === 'tags') {
    const sel = c.key === 'status' ? statusFilterSel : tagFilterSel;
    return `<div class="th-filter-wrap">
      <span>${c.label}</span>
      <button type="button" class="th-filter__btn ${sel.size ? 'is-active' : ''}" onclick="toggleFilterPanel('${c.key}', this)"><i class="fa-solid fa-filter"></i></button>
    </div>`;
  }
  return `<div${c.align === 'right' ? ' style="text-align:right"' : ''}>${c.label}</div>`;
}

/* ── 分頁 ────────────────────────────────────────────── */
let currentPage = 1;
let pageSize = Number(localStorage.getItem('ux_admin_news_pagesize_v1')) || 10;
const PAGE_SIZE_OPTIONS = [10, 20, 50];

function changePageSize(v) {
  pageSize = Number(v);
  localStorage.setItem('ux_admin_news_pagesize_v1', String(pageSize));
  currentPage = 1;
  render();
}
function goToPage(p) { currentPage = p; render(); }

function renderPagination(total, totalPages) {
  const box = document.getElementById('pagination');
  if (!total) { box.innerHTML = ''; return; }
  const sizeSelect = `
    <label class="pagination__size">每頁顯示
      <select onchange="changePageSize(this.value)">
        ${PAGE_SIZE_OPTIONS.map(n => `<option value="${n}" ${n === pageSize ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
      筆，共 ${total} 筆
    </label>`;
  let pages = '';
  if (totalPages > 1) {
    pages = `<div class="pagination__pages">
      <button type="button" class="btn btn-sm" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">上一頁</button>
      ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `<button type="button" class="btn btn-sm ${p === currentPage ? 'btn-primary' : ''}" onclick="goToPage(${p})">${p}</button>`).join('')}
      <button type="button" class="btn btn-sm" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">下一頁</button>
    </div>`;
  }
  box.innerHTML = `<div class="pagination__bar">${sizeSelect}${pages}</div>`;
}

function render() {
  const kw = document.getElementById('kw').value.trim().toLowerCase();
  let list = loadActiveNews().filter(n => !kw || n.title.toLowerCase().includes(kw));
  if (statusFilterSel.size) list = list.filter(n => statusFilterSel.has(getStatus(n)));
  if (tagFilterSel.size) list = list.filter(n => (n.tags || []).some(t => tagFilterSel.has(t)));

  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  const pageList = list.slice((currentPage - 1) * pageSize, currentPage * pageSize);

  const box = document.getElementById('dataList');
  const head = `<div class="data-row data-row--head">${visibleCols.map(headerCell).join('')}</div>`;

  if (!total) {
    box.innerHTML = head + `<div class="empty-state">找不到符合的新聞，試試看清空搜尋關鍵字或篩選條件</div>`;
  } else {
    box.innerHTML = head + pageList.map(n => `
      <div class="data-row">
        ${visibleCols.map(c => newsCell(c.key, n)).join('')}
      </div>
    `).join('');
  }

  renderPagination(total, totalPages);
  renderFilterPanel();
  renderTrashToggle();
  if (showTrash) renderTrash();
}

function renderTrashToggle() {
  const count = loadTrashedNews().length;
  document.getElementById('trashToggle').textContent = `垃圾桶(${count})`;
}

function renderTrash() {
  const list = loadTrashedNews();
  const box = document.getElementById('trashList');
  const head = `
    <div class="data-row data-row--head">
      <div>封面</div><div>標題</div><div>標籤</div><div>刪除時間</div><div style="text-align:right">操作</div>
    </div>`;
  if (!list.length) {
    box.innerHTML = head + `<div class="empty-state">垃圾桶是空的</div>`;
    return;
  }
  box.innerHTML = head + list.map(n => `
    <div class="data-row">
      <img class="data-thumb" src="${n.cover || ''}" alt="" onerror="this.style.visibility='hidden'" />
      <div>
        <div class="data-title">${n.title}</div>
        <div class="data-sub">/${n.slug || ''}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${tagChipsHtml(n.tags, 3, 'data-tag', '<span class="data-sub">—</span>')}</div>
      <div class="data-date">${dateTimeCellHtml((n.trashedAt||'').slice(0,16))}</div>
      <div class="data-actions">
        <button class="btn btn-sm" onclick="restoreItem('${n.id}')">還原</button>
        <button class="btn btn-sm btn-danger" onclick="purgeItem('${n.id}')">永久刪除</button>
      </div>
    </div>
  `).join('');
}

function trashItem(id) {
  if (!confirm('移到垃圾桶?之後還可以還原，不會馬上消失。')) return;
  trashNewsById(id);
  render();
}
function restoreItem(id) {
  restoreNewsById(id);
  render();
}
function purgeItem(id) {
  if (!confirm('永久刪除後無法復原，確定嗎?')) return;
  purgeNewsById(id);
  render();
}

document.getElementById('kw').addEventListener('input', () => { currentPage = 1; render(); });
document.getElementById('trashToggle').addEventListener('click', () => {
  showTrash = !showTrash;
  document.getElementById('trashSection').style.display = showTrash ? 'block' : 'none';
  if (showTrash) renderTrash();
});
</script>
</body>
</html>
