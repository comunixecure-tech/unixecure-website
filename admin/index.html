<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>uniXecure 內容管理後台</title>
<link rel="stylesheet" href="style.css" />
<script src="https://kit.fontawesome.com/fb083deec1.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="topbar">
  <div class="wrap topbar__inner">
    <div class="topbar__left">
      <a class="topbar__brand" href="index.html">
        <span class="topbar__brand-badge">UX</span>
        uniXecure 內容管理後台
      </a>
    </div>
    <a class="topbar__back" href="../index.html"><i>←</i> 回官網</a>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <div>
      <h1>選擇要管理的內容類型</h1>
      <p>點選卡片進入該類型的內容列表，新增或編輯官網上顯示的內容。</p>
    </div>
  </div>

  <div class="type-grid" id="typeGrid"></div>
</div>

<script src="app.js"></script>
<script>
const TYPES = [
  { key:'news', name:'新聞中心', desc:'產品動態、合規升級、產業觀察', badge:'新', color:'#3c49ba', href:'news.html', open:true },
  { key:'cases', name:'成功案例', desc:'各產業導入案例，含列表與內頁', badge:'案', color:'#4caf82', href:'cases.html', open:true },
  { key:'contract', name:'共同供應契約', desc:'契約主檔與品項明細', badge:'契', color:'#8a5cf6', href:'#', open:false },
  { key:'reports', name:'報告書專區', desc:'白皮書、技術文件、產品型錄', badge:'報', color:'#e2544a', href:'#', open:false },
  { key:'videos', name:'影音專區', desc:'直接連結至 YouTube 影片', badge:'影', color:'#2ba0c9', href:'#', open:false },
  { key:'partners', name:'代理產品', desc:'代理產品 / 品牌頁 / 產品頁 三層結構', badge:'代', color:'#c9852b', href:'#', open:false },
];

function newsCount(){
  try { return loadActiveNews().length; } catch(e){ return 0; }
}
function casesCount(){
  try { return createContentStore('ux_admin_cases_v1', SEED_CASES, 'c').loadActive().length; } catch(e){ return 0; }
}
const COUNTERS = { news: newsCount, cases: casesCount };

const grid = document.getElementById('typeGrid');
grid.innerHTML = TYPES.map(t => {
  const count = COUNTERS[t.key] ? COUNTERS[t.key]() : null;
  const countHtml = t.open
    ? `<span class="type-card__count">共 <b>${count}</b> 筆</span>`
    : `<span class="type-card__count">尚未建立內容</span>`;
  return `
    <${t.open ? 'a' : 'div'} class="type-card ${t.open ? 'is-active' : 'is-disabled'}" ${t.open ? `href="${t.href}"` : ''}>
      <div class="type-badge" style="background:${t.color}">${t.badge}</div>
      <div>
        <div class="type-card__title">${t.name}</div>
        <div class="type-card__desc">${t.desc}</div>
      </div>
      <div class="type-card__foot">
        ${countHtml}
      </div>
    </${t.open ? 'a' : 'div'}>
  `;
}).join('');
</script>
</body>
</html>
