<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>報告書專區 · uniXecure 智慧資安科技</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://kit.fontawesome.com/fb083deec1.js" crossorigin="anonymous"></script>
<script>
  (function () {
    try {
      var k = 'ux-theme';
      var saved = localStorage.getItem(k);
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="ds/colors_and_type.css" />
<link rel="stylesheet" href="bright/bright.css" />
<link rel="stylesheet" href="bright/sections.css" />
<link rel="stylesheet" href="bright/back-to-top.css" />
<link rel="stylesheet" href="bright/list-page.css" />
<script src="bright/custom-select.js" defer></script>
<script src="image-slot.js"></script>
<style>
.rep-grid{display:grid;grid-template-columns:repeat(5,1fr);align-items:start;gap:22px}
@media(max-width:900px){.rep-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:540px){.rep-grid{grid-template-columns:1fr}}
.rep-card{background:none;box-shadow:none;border:none;border-radius:0;text-decoration:none;color:inherit;transition:transform .28s var(--b-ease),box-shadow .28s var(--b-ease);overflow:hidden;display:flex;flex-direction:column;align-items:stretch;text-align:left}
.rep-card:hover .rep-cover{transform:translateY(-4px);box-shadow:0 14px 36px -6px rgba(60,73,186,.32)}
.rep-cover{position:relative;width:100%;aspect-ratio:132/186;border-radius:4px;overflow:hidden;box-shadow:0 8px 24px rgba(60,73,186,.18);transition:transform .3s var(--b-ease),box-shadow .3s var(--b-ease)}
.rep-cover image-slot{position:absolute;inset:0;width:100%;height:100%}
.rep-body{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:14px}
.rep-title{font-size:14px;font-weight:700;color:var(--b-ink);line-height:1.4;margin:0}
.rep-card:hover .rep-title{color:var(--b-indigo)}
.rep-year{font-family:var(--ux-font-mono);font-size:14px;color:var(--b-ink-4);margin:0}
.rep-cta{margin-top:2px;font-size:14px;font-weight:600;color:var(--b-indigo);display:inline-flex;align-items:center;gap:6px;opacity:0;transition:opacity .2s,gap .2s}
.rep-card:hover .rep-cta{opacity:1;gap:10px}
.reports-hero{background:var(--ux-primary-950)}
.reports-hero .page-hero__title{color:var(--b-amber)}
.reports-hero .page-hero__title em{color:var(--ux-white)}
.list-main{background:var(--ux-primary-50)}
[data-theme="dark"] .list-main{background:oklch(12% 0.04 266)}
</style>
</head>
<body>
  <site-nav active="reports"></site-nav>

<header class="page-hero page-hero--list reports-hero">
  <div class="page-hero__deco" aria-hidden="true">
    <svg width="420" height="420" viewBox="0 0 468 468" fill="none" style="position:absolute;right:-60px;top:-80px;opacity:.13;">
      <path d="M234 0L436.65 117V351L234 468L31.35 351V117L234 0Z" fill="url(#rga)" />
      <defs><linearGradient id="rga" x1="0" y1="0" x2="468" y2="468" gradientUnits="userSpaceOnUse"><stop stop-color="#FFB415" /><stop offset="1" stop-color="#3C49BA" /></linearGradient></defs>
    </svg>
    <svg width="260" height="260" viewBox="0 0 468 468" fill="none" style="position:absolute;left:-40px;bottom:-30px;opacity:.07;">
      <path d="M234 0L436.65 117V351L234 468L31.35 351V117L234 0Z" fill="url(#rgb)" />
      <defs><linearGradient id="rgb" x1="0" y1="0" x2="468" y2="468" gradientUnits="userSpaceOnUse"><stop stop-color="#FFB415" /><stop offset="1" stop-color="#3C49BA" /></linearGradient></defs>
    </svg>
  </div>
  <div class="wrap">
    <div class="page-hero__titlerow">
      <h1 class="page-hero__title">報告書<em>專區</em></h1>
      <span class="page-hero__count" id="resultCount"></span>
    </div>
    <p class="page-hero__sub">白皮書、產品型錄與技術文件，掌握深度資安洞察。</p>
    <div class="filter-bar">
      <div class="filter-bar__row">
        <div class="filter-bar__select-wrap">
          <select class="filter-bar__select" id="yearFilter">
            <option value="">所有年度</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
          </select>
          <i class="fa-solid fa-chevron-down filter-bar__select-icon"></i>
        </div>
        <div class="filter-bar__select-wrap">
          <select class="filter-bar__select" id="typeFilter">
            <option value="">所有文件類型</option>
            <option value="白皮書">白皮書</option>
            <option value="產品型錄">產品型錄</option>
            <option value="技術文件">技術文件</option>
          </select>
          <i class="fa-solid fa-chevron-down filter-bar__select-icon"></i>
        </div>
        <div class="ux-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="kwFilter" placeholder="關鍵字搜尋" />
        </div>
      </div>
    </div>
  </div>
</header>

<section class="list-main">
  <div class="wrap">
    <div class="rep-grid" id="listGrid"></div>
    <div class="c-pagination" id="pagination"></div>
  </div>
</section>

<site-cta></site-cta>
<site-footer></site-footer>

<script>
const items = [
  { year:'2026', type:'白皮書', title:'全域聯防終極指南' },
  { year:'2026', type:'技術文件', title:'RAVEN 資安監控維運中心技術架構白皮書' },
  { year:'2026', type:'產品型錄', title:'HEIS 資安意識人因分析系統產品型錄' },
  { year:'2025', type:'白皮書', title:'公部門 G-SOC 聯防架構導入指南' },
  { year:'2025', type:'技術文件', title:'SRMAS 系統資源監控暨告警系統技術手冊' },
  { year:'2025', type:'產品型錄', title:'LUCAS 跡證保存系統產品型錄' },
  { year:'2025', type:'白皮書', title:'2025 台灣企業資安意識調查報告' },
  { year:'2025', type:'技術文件', title:'跡證保存與法遵鑑識實務指引' },
];
const stockPhotos = [
  'assets/reports/rep-stock-1.jpg',
  'assets/reports/rep-stock-2.jpg',
  'assets/reports/rep-stock-3.jpg',
  'assets/reports/rep-stock-4.jpg'
];
const PER_PAGE = 5; let filtered=[...items]; let page=1;
function applyFilter(){
  const y=document.getElementById('yearFilter').value, t=document.getElementById('typeFilter').value, kw=document.getElementById('kwFilter').value.trim().toLowerCase();
  const active = !!(y||t||kw);
  filtered = items.filter(it => (!y||it.year===y) && (!t||it.type===t) && (!kw||it.title.toLowerCase().includes(kw)));
  page=1; render(active);
}
function goPage(n){ page=n; render(lastActive); const top=document.querySelector('.list-main').offsetTop-88; window.scrollTo({top,behavior:'smooth'}); }
let lastActive=false;
function render(isFiltered){
  lastActive = !!isFiltered;
  const grid=document.getElementById('listGrid'), pg=document.getElementById('pagination');
  document.getElementById('resultCount').textContent=(isFiltered?'符合 ':'共 ')+filtered.length+' 份';
  const slice=filtered.slice((page-1)*PER_PAGE,page*PER_PAGE);
  if(!slice.length){ grid.innerHTML='<div class="c-empty"><i class="fa-regular fa-file-lines"></i>找不到符合的文件</div>'; pg.innerHTML=''; return; }
  grid.innerHTML=slice.map((it,i)=>`
    <a class="rep-card" href="reports-detail.html">
      <div class="rep-cover"><image-slot id="rep-${it.year}-${i}" placeholder="報告封面" shape="rect" src="${stockPhotos[i%stockPhotos.length]}"></image-slot></div>
      <div class="rep-body">
        <span class="rep-year">${it.year} · ${it.type}</span>
        <h3 class="rep-title">${it.title}</h3>
        <span class="rep-cta">前往了解 <i class="fa-solid fa-arrow-right"></i></span>
      </div>
    </a>`).join('');
  const total=Math.ceil(filtered.length/PER_PAGE);
  if(total<=1){ pg.innerHTML=''; return; }
  let h=`<button class="c-pg" ${page===1?'disabled':''} onclick="goPage(${page-1})"><i class="fa-solid fa-chevron-left"></i></button>`;
  for(let i=1;i<=total;i++) h+=`<button class="c-pg ${i===page?'is-active':''}" onclick="goPage(${i})">${i}</button>`;
  h+=`<button class="c-pg" ${page===total?'disabled':''} onclick="goPage(${page+1})"><i class="fa-solid fa-chevron-right"></i></button>`;
  pg.innerHTML=h;
}
document.getElementById('kwFilter').addEventListener('input',applyFilter);
document.getElementById('yearFilter').addEventListener('change',applyFilter);
document.getElementById('typeFilter').addEventListener('change',applyFilter);
render();
</script>
<site-back-to-top></site-back-to-top>
<script src="site-chrome.js"></script>
</body>
</html>
